name: Release ATS OneBSS Miền Bắc for macOS

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build app
        run: ./scripts/build_app.sh
      - name: Package app
        run: |
          version="$(uv run python -c 'from ats_onebss import __version__; print(__version__)')"
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/ATS-OneBSS-${version}.app" \
            "dist/ATS-OneBSS-macOS-arm64-${version}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/ATS-OneBSS-macOS-arm64-*.zip

  publish-release:
    needs: [build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          body: |
            - Bản tiêu chuẩn dành riêng cho Miền Bắc, phát triển từ mã nguồn ATS OneBSS 0.9.41.
            - Chỉ đóng gói cấu hình, quy tắc và workbook Miền Bắc.
            - Gói ứng dụng macOS Apple Silicon.
