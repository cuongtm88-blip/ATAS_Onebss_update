name: Build ATS OneBSS Miền Bắc for macOS

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build app
        run: ./scripts/build_app.sh
      - name: Package app
        run: |
          version="$(uv run python -c 'from ats_onebss import __version__; print(__version__)')"
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/ATS-OneBSS-${version}.app" \
            "dist/ATS-OneBSS-macOS-arm64-${version}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/ATS-OneBSS-macOS-arm64-*.zip
