name: Release ATS OneBSS Miền Bắc for macOS

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Run tests
        run: |
          uv sync --extra dev --extra packaging
          uv run pytest -q
      - name: Build app
        run: ./scripts/build_app.sh
      - name: Package app
        run: |
          version="$(uv run python -c 'from ats_onebss import __version__; print(__version__)')"
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/ATS-OneBSS-${version}.app" \
            "dist/ATS-OneBSS-macOS-arm64-${version}.zip"
      - name: Verify release package
        run: |
          set -eu
          version="$(uv run python -c 'from ats_onebss import __version__; print(__version__)')"
          app="dist/ATS-OneBSS-${version}.app"
          zip="dist/ATS-OneBSS-macOS-arm64-${version}.zip"
          actual="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
          test "$actual" = "$version"
          bundle_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist")"
          test "$bundle_version" = "$version"
          codesign --verify --deep --strict "$app"
          unzip -t "$zip"
          check_dir="$(mktemp -d)"
          ditto -x -k "$zip" "$check_dir"
          extracted="$check_dir/ATS-OneBSS-${version}.app"
          codesign --verify --deep --strict "$extracted"
          test -f "$extracted/Contents/Frameworks/assignment_rules.xlsx"
          test -f "$extracted/Contents/Frameworks/project_rules.toml"
          grep -q '^read_batch_size = 20$' "$extracted/Contents/Frameworks/config.toml"
          grep -q '^read_batch_threshold = 50$' "$extracted/Contents/Frameworks/config.toml"
          grep -q 'Cục Tin Học Và Thống Kê Tài Chính' "$extracted/Contents/Frameworks/project_rules.toml"
          uv run python -c 'from ats_onebss.rules import load_rules; from pathlib import Path; import sys; rules=load_rules(Path(sys.argv[1])); assert len(rules) == 69; print(f"Verified packaged rules: {len(rules)}")' "$extracted/Contents/Frameworks/assignment_rules.xlsx"
          uv run python - "$extracted" <<'PY'
          from pathlib import Path
          import tempfile
          import types
          from PyInstaller.archive.readers import CArchiveReader, ZlibArchiveReader

          app = Path(__import__("sys").argv[1])
          executable = app / "Contents/MacOS" / app.stem
          with tempfile.NamedTemporaryFile(suffix=".pyz") as pyz_file:
              pyz_file.write(CArchiveReader(str(executable)).extract("PYZ.pyz"))
              pyz_file.flush()
              archive = ZlibArchiveReader(pyz_file.name)

              def find_code(code, name):
                  if isinstance(code, types.CodeType):
                      if code.co_name == name:
                          return code
                      for item in code.co_consts:
                          found = find_code(item, name)
                          if found:
                              return found
                  return None

              collect_plan = find_code(archive.extract("ats_onebss.cli"), "collect_plan")
              plan_assignments = find_code(
                  archive.extract("ats_onebss.planner"), "plan_assignments"
              )
              assert plan_assignments and {
                  "SMS Brandname", "Tạo đơn hàng trả trước", "Lê Đức Tuấn",
              } <= set(plan_assignments.co_consts)
              browser = archive.extract("ats_onebss.browser")
              attendance = archive.extract("ats_onebss.attendance")
              attendance_ui = archive.extract("ats_onebss.attendance_ui")
              calendar_sync = archive.extract("ats_onebss.calendar_sync")
              cli = archive.extract("ats_onebss.cli")
              config_module = archive.extract("ats_onebss.config")
              region_module = archive.extract("ats_onebss.ticket_region")
              rules_module = archive.extract("ats_onebss.rules")
              ledger_module = archive.extract("ats_onebss.ledger")
              collect_names = (
                  set(collect_plan.co_varnames)
                  | set(collect_plan.co_cellvars)
                  | set(collect_plan.co_freevars)
              ) if collect_plan else set()
              assert "planner_skips" in collect_names
              assert plan_assignments and "skipped_reasons" in plan_assignments.co_varnames
              assert find_code(attendance, "default_leave_deduction_percent")
              availability = find_code(attendance, "monthly_availability_ratios")
              validate_calendar = find_code(attendance, "validate_calendar")
              assert availability and "deduction_percent" in availability.co_consts
              assert "effective_date" in availability.co_cellvars
              assert validate_calendar and "deduction_percent" in validate_calendar.co_consts
              dialog_init = find_code(attendance_ui, "__init__")
              table_filter = find_code(attendance_ui, "_refresh_leave_table")
              assert dialog_init and {"leave_month", "leave_year", "leave_deduction"} <= set(dialog_init.co_names)
              assert table_filter and "_selected_month" in table_filter.co_names
              sync_state = find_code(calendar_sync, "_cloud_state")
              assert sync_state and "deduction_percent" in repr(sync_state.co_consts)
              calendar_writer = find_code(browser, "append_calendar_events")
              assert calendar_writer and "L1" in calendar_writer.co_consts
              assert "export_rows" in calendar_writer.co_names
              assert find_code(cli, "sync_attendance_calendar")
              process_available = find_code(cli, "process_available")
              queue_window = find_code(cli, "_queue_read_window_size")
              working_time_block = find_code(cli, "_working_time_block_reason")
              gui = archive.extract("ats_onebss.gui")
              main = find_code(cli, "main")
              worker_command = find_code(gui, "worker_command")
              gui_load_region = find_code(gui, "_load_region")
              load_config = find_code(config_module, "load_config")
              sheet_count_status = find_code(region_module, "sheet_count_status")
              load_project_rules = find_code(rules_module, "load_project_rules")
              append_assignments = find_code(browser, "append")
              bulk_override = find_code(ledger_module, "set_manual_overrides")
              selected_skipped = find_code(gui, "_selected_skipped_tickets")
              assign_skipped = find_code(gui, "_assign_selected_skipped")
              calendar_crash_check = find_code(cli, "_is_browser_target_crash")
              open_clients = find_code(cli, "open_clients")
              watch = find_code(cli, "command_watch")
              assert process_available and any(
                  isinstance(value, str) and value.startswith("Bắt đầu đọc lô ")
                  for value in process_available.co_consts
              )
              assert queue_window and "read_batch_size" in queue_window.co_consts
              assert load_config and {
                  "1giulYOsX2gjqmgrLqk9fyiOePNhMe-lJ6IIm8cBDBZI",
                  "read_batch_size",
                  "read_batch_threshold",
              } <= set(load_config.co_consts)
              assert working_time_block and "allow_outside_working_hours" in working_time_block.co_consts
              assert process_available and "_working_time_block_reason" in process_available.co_names
              assert main and "allow_outside_working_hours" in main.co_names
              assert worker_command and "--allow-outside-working-hours" in worker_command.co_consts
              assert gui_load_region and "allow_outside_working_hours" in gui_load_region.co_names
              assert sheet_count_status and "Chưa xác định" in sheet_count_status.co_consts
              assert load_project_rules and 1.2 in load_project_rules.co_consts
              assert append_assignments and "count_status" in repr(append_assignments.co_consts)
              assert load_config and "count_status" in load_config.co_consts
              assert bulk_override and "executemany" in bulk_override.co_names
              assert selected_skipped and "Mã giao dịch" in selected_skipped.co_consts
              assert assign_skipped and "set_manual_overrides" in assign_skipped.co_names
              assert calendar_crash_check and "target crashed" in calendar_crash_check.co_consts
              assert open_clients and {
                  "_is_browser_target_crash", "restart_context",
              } <= set(open_clients.co_names)
              assert watch and {
                  "_is_browser_target_crash", "recover_browser",
              } <= set(watch.co_names)
              print("Verified packaged VIP-skip handling.")
              print("Verified packaged SMS prepaid-order routing.")
              print("Verified packaged attendance percentage and monthly filter.")
              print("Verified attendance deductions activate on leave dates.")
              print("Verified packaged region classification and project multiplier.")
              print("Verified packaged count-status sheet field and bulk skipped-ticket assignment.")
              print("Verified packaged North queue window threshold and size.")
              print("Verified packaged outside-hours toggle and worker option.")
              print("Verified packaged calendar sync crash recovery before OneBSS startup and during cycles.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/ATS-OneBSS-macOS-arm64-*.zip

  publish-release:
    needs: [build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          body: |
            - Bản tiêu chuẩn dành riêng cho Miền Bắc, phát triển từ mã nguồn ATS OneBSS 0.9.41.
            - Chỉ đóng gói cấu hình, quy tắc và workbook Miền Bắc.
            - Gói ứng dụng chỉ dành cho macOS Apple Silicon.
            - Phân loại tỉnh từ Địa chỉ lắp đặt, dự phòng Tỉnh LĐ; đánh dấu Không tính cho phiếu ngoài Miền Bắc.
            - Áp dụng hệ số điểm dự án 1,2; đồng bộ công thức ngày/tháng và hỗ trợ chỉ định nhiều phiếu chưa giao.
            - Phục hồi Chromium khi tab Google Sheets crash trong lúc đồng bộ lịch, sau đó tiếp tục mở OneBSS.
            - Phiếu SMS Brandname có Kiểu lắp đặt “Tạo đơn hàng trả trước” được giao cố định cho Lê Đức Tuấn, không phụ thuộc VIP xử lý.
            - Mục tiêu tải theo lịch nghỉ chỉ giảm từ ngày nghỉ thực tế; ngày nghỉ tương lai chưa làm giảm mục tiêu.
