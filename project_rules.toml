# Quy tắc ưu tiên được xét trước quy tắc nhân sự theo từng dịch vụ trong Excel.
# Tên trường hỗ trợ: subscriber_name, customer_name, labor_address,
# connection_address, labor_province. Mọi dự án có route_field = labor_address
# sẽ kiểm tra Địa chỉ LĐ trước, rồi tự dự phòng bằng Tỉnh LĐ.

[[projects]]
name = "Đài THVN"
priority = 100
match_fields = ["subscriber_name"]
contains = "Đài THVN"
fixed_assignee = "Nguyễn Hoàng Dương"

[[projects]]
name = "Đài Phát Thanh - Truyền Hình Hà Nội"
priority = 100
match_fields = ["customer_name"]
contains = "ĐÀI PHÁT THANH - TRUYỀN HÌNH HÀ NỘI"
fixed_assignee = "Nguyễn Hoàng Dương"

[[projects]]
name = "Cục Quản Trị NHNN - Kênh phục vụ HNTH"
priority = 95
match_fields = ["customer_name"]
contains = "Cục Quản Trị Ngân Hàng Nhà Nước Việt Nam"
required_contains = { notes = "Kênh phục vụ HNTH" }
fixed_assignee = "Nguyễn Hoàng Dương"

[[projects]]
name = "Dự án BCA"
priority = 90
# OneBSS có thể hiển thị tên khách hàng ở cột Tên KH hoặc Tên thuê bao.
match_fields = ["customer_name", "subscriber_name"]
contains = "Cục Viễn Thông & Cơ Yếu Bca"
route_field = "labor_address"

