[project]
name = "ats-onebss"
version = "0.9.34"
description = "Tự động cân bằng điểm, giao phiếu OneBSS và ghi Google Sheets"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1.5",
  "playwright>=1.54.0",
  "pyside6>=6.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.4.0"]
packaging = ["pyinstaller>=6.15.0"]

[project.scripts]
ats-onebss = "ats_onebss.cli:main"
ats-onebss-gui = "ats_onebss.gui_main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ats_onebss"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
